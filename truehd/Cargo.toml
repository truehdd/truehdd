[package]
name = "truehd"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "Research implementation of Dolby TrueHD parser/decoder"
repository = "https://github.com/truehdd/truehdd/tree/main/truehd"
authors = ["Rainbaby"]
rust-version = "1.88.0"
# Integration tests need bitstreams that are not distributable
exclude = ["tests/"]

[lib]
name = "truehd"
crate-type = ["lib"]

[features]
# Per-stage parse timing, read with Parser::last_parse_stats
perf = []
# Evolution frame protection checking, with ExtraData::verify_evo_protection
evo-protection = ["dep:hmac", "dep:sha2"]

[dependencies]
anyhow = "1.0.104"
bitstream-io = "4.10.0"
thiserror = "2.0.19"
log = "0.4.33"
hmac = { version = "0.12.1", optional = true }
sha2 = { version = "0.10.9", optional = true }

[package.metadata.release]
pre-release-replacements = [
    {file="README.md", search="truehd = \"[a-z0-9\\.-]+\"", replace="truehd = \"{{version}}\""},
    {file="CHANGELOG.md", search="## \\[Unreleased\\]", replace="## [Unreleased]\n\n## [{{version}}] - {{date}}"},
]
