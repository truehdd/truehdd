on:
  workflow_dispatch:

name: Artifacts

env:
  RELEASE_BIN: truehdd
  RELEASE_DIR: artifacts
  BUILD_PROFILE: release-deploy
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  WINDOWS_ARM_TARGET: aarch64-pc-windows-msvc
  MACOS_X86_TARGET: x86_64-apple-darwin
  LINUX_MUSL_TARGET: x86_64-unknown-linux-musl
  LINUX_MUSL_ARM_TARGET: aarch64-unknown-linux-musl
  LINUX_GNU_TARGET: x86_64-unknown-linux-gnu
  LINUX_GNU_ARM_TARGET: aarch64-unknown-linux-gnu

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    
    steps:
      # Full history so git describe can resolve the version string
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-release-env
      
      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install musl-tools gcc-aarch64-linux-gnu -y

      - name: Build
        run: |
          rustup target add ${{ env.LINUX_MUSL_TARGET }}
          rustup target add ${{ env.LINUX_MUSL_ARM_TARGET }}
          rustup target add ${{ env.LINUX_GNU_TARGET }}
          rustup target add ${{ env.LINUX_GNU_ARM_TARGET }}

          # MUSL builds
          cargo build --profile ${{ env.BUILD_PROFILE }} --target ${{ env.LINUX_MUSL_TARGET }}
          cargo build --config "target.${{ env.LINUX_MUSL_ARM_TARGET }}.linker = 'aarch64-linux-gnu-gcc'" \
            --profile ${{ env.BUILD_PROFILE }} --target ${{ env.LINUX_MUSL_ARM_TARGET }}

          # GNU builds
          cargo build --profile ${{ env.BUILD_PROFILE }} --target ${{ env.LINUX_GNU_TARGET }}
          cargo build --config "target.${{ env.LINUX_GNU_ARM_TARGET }}.linker = 'aarch64-linux-gnu-gcc'" \
            --profile ${{ env.BUILD_PROFILE }} --target ${{ env.LINUX_GNU_ARM_TARGET }}

      - name: Create tarball and checksum
        run: |
          # MUSL builds
          X86_64_MUSL_ARCHIVE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.LINUX_MUSL_TARGET }}.tar.gz
          AARCH64_MUSL_ARCHIVE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.LINUX_MUSL_ARM_TARGET }}.tar.gz

          mv ./target/${{ env.LINUX_MUSL_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} ./${{ env.RELEASE_BIN }}
          tar -cvzf ./${X86_64_MUSL_ARCHIVE} ./${{ env.RELEASE_BIN }}

          mv ./target/${{ env.LINUX_MUSL_ARM_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} ./${{ env.RELEASE_BIN }}
          tar -cvzf ./${AARCH64_MUSL_ARCHIVE} ./${{ env.RELEASE_BIN }}

          # GNU builds
          X86_64_GNU_ARCHIVE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.LINUX_GNU_TARGET }}.tar.gz
          AARCH64_GNU_ARCHIVE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.LINUX_GNU_ARM_TARGET }}.tar.gz

          mv ./target/${{ env.LINUX_GNU_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} ./${{ env.RELEASE_BIN }}
          tar -cvzf ./${X86_64_GNU_ARCHIVE} ./${{ env.RELEASE_BIN }}

          mv ./target/${{ env.LINUX_GNU_ARM_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} ./${{ env.RELEASE_BIN }}
          tar -cvzf ./${AARCH64_GNU_ARCHIVE} ./${{ env.RELEASE_BIN }}

          # Generate checksums
          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${X86_64_MUSL_ARCHIVE}').read_bytes()).hexdigest())" > ${X86_64_MUSL_ARCHIVE}.sha256
          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${AARCH64_MUSL_ARCHIVE}').read_bytes()).hexdigest())" > ${AARCH64_MUSL_ARCHIVE}.sha256
          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${X86_64_GNU_ARCHIVE}').read_bytes()).hexdigest())" > ${X86_64_GNU_ARCHIVE}.sha256
          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${AARCH64_GNU_ARCHIVE}').read_bytes()).hexdigest())" > ${AARCH64_GNU_ARCHIVE}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Linux artifacts
          path: ./${{ env.RELEASE_DIR }}/*

  windows-binary:
    runs-on: windows-latest

    steps:
      # Full history so git describe can resolve the version string
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-release-env
      
      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Install cargo-c
        run: |
          $LINK = "https://github.com/lu-zero/cargo-c/releases/latest/download"
          $CARGO_C_FILE = "cargo-c-windows-msvc"
          curl -LO "$LINK/$CARGO_C_FILE.zip"
          7z e -y "$CARGO_C_FILE.zip" -o"${env:USERPROFILE}\.cargo\bin"

      - name: Build
        run: |
          rustup target add ${{ env.WINDOWS_ARM_TARGET }}

          cargo build --profile ${{ env.BUILD_PROFILE }}
          cargo build --profile ${{ env.BUILD_PROFILE }} --target ${{ env.WINDOWS_ARM_TARGET }}

      - name: Create zipfile
        shell: bash
        run: |
          X86_64_ARCHIVE_FILE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.WINDOWS_TARGET }}.zip
          AARCH64_ARCHIVE_FILE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-${{ env.WINDOWS_ARM_TARGET }}.zip

          mv ./target/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }}.exe ./${{ env.RELEASE_BIN }}.exe
          7z a ./${X86_64_ARCHIVE_FILE} ./${{ env.RELEASE_BIN }}.exe

          mv ./target/${{ env.WINDOWS_ARM_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }}.exe ./${{ env.RELEASE_BIN }}.exe
          7z a ./${AARCH64_ARCHIVE_FILE} ./${{ env.RELEASE_BIN }}.exe

          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${X86_64_ARCHIVE_FILE}').read_bytes()).hexdigest())" > ${X86_64_ARCHIVE_FILE}.sha256
          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${AARCH64_ARCHIVE_FILE}').read_bytes()).hexdigest())" > ${AARCH64_ARCHIVE_FILE}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows artifacts
          path: ./${{ env.RELEASE_DIR }}/*

  macos-binary:
    runs-on: macos-latest

    steps:
      # Full history so git describe can resolve the version string
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-release-env
      
      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build
        run: |
          rustup target add ${{ env.MACOS_X86_TARGET }}

          cargo build --profile ${{ env.BUILD_PROFILE }}
          cargo build --profile ${{ env.BUILD_PROFILE }} --target ${{ env.MACOS_X86_TARGET }}

      - name: Create universal macOS binary
        run: |
          lipo -create \
            ./target/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} \
            ./target/${{ env.MACOS_X86_TARGET }}/${{ env.BUILD_PROFILE }}/${{ env.RELEASE_BIN }} \
            -output ./${{ env.RELEASE_BIN }}

      - name: Create zipfile
        run: |
          ARCHIVE_FILE=${{ env.RELEASE_DIR }}/${{ env.ARCHIVE_PREFIX }}-universal-macOS.zip
          zip -9 ./${ARCHIVE_FILE} ./${{ env.RELEASE_BIN }}

          python -c "import hashlib; import pathlib; print(hashlib.sha256(pathlib.Path('${ARCHIVE_FILE}').read_bytes()).hexdigest())" > ${ARCHIVE_FILE}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macOS artifacts
          path: ./${{ env.RELEASE_DIR }}/*

  create-release:
    needs: [linux-binary, windows-binary, macos-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Full history so the previous tag can be resolved for the release notes
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Sets RELEASE_PKG_VERSION and ARCHIVE_PREFIX. GITHUB_ENV does not cross jobs, so
      # this job has to derive them the same way the build jobs did, from the manifest.
      - uses: ./.github/actions/setup-release-env

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Display structure of downloaded files
        run: ls -R

      # Asset names are part of the download contract for tools that fetch
      # releases automatically; do not rename them between releases.
      - name: Check the artifacts are the ones the release claims
        shell: bash
        run: |
          .github/artifacts.sh > "${RUNNER_TEMP}/artifacts.txt"

          status=0
          expected=""

          while IFS='|' read -r _platform _cpu file; do
            expected="${expected} ${file}"
            found=$(find . -maxdepth 2 -type f -name "${file}")

            if [ -z "${found}" ]; then
              echo "missing: ${file}"
              status=1
              continue
            fi

            if [ ! -f "${found}.sha256" ]; then
              echo "missing checksum: ${file}.sha256"
              status=1
              continue
            fi

            recorded=$(tr -d '[:space:]' < "${found}.sha256")
            actual=$(sha256sum "${found}" | cut -d' ' -f1)

            if [ "${recorded}" != "${actual}" ]; then
              echo "checksum does not match the archive: ${file}"
              echo "  recorded ${recorded}"
              echo "  actual   ${actual}"
              status=1
            fi
          done < "${RUNNER_TEMP}/artifacts.txt"

          # An archive nobody expected means a target was added to a build job and not to
          # the list, so the release would carry a file the notes never mention.
          while read -r built; do
            case " ${expected} " in
              *" $(basename "${built}") "*) ;;
              *) echo "not in the list: ${built}"; status=1 ;;
            esac
          done < <(find . -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' \))

          if [ "${status}" -ne 0 ]; then
            echo "the built artifacts and the release notes disagree" >&2
            exit 1
          fi

          echo "every expected artifact is present, with a checksum that matches"

      - name: Compose release notes
        shell: bash
        run: |
          # Each crate is versioned on its own, so read the library manifest too. The
          # binary's version is already resolved, and is what the archives are named with.
          VERSION="${{ env.RELEASE_PKG_VERSION }}"
          LIB_VERSION=$(grep -m1 '^version = ' truehd/Cargo.toml | cut -d'"' -f2)

          # Everything released since the previous tag, so versions that were
          # tagged but never published are included
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "Releasing ${VERSION} (library ${LIB_VERSION}), previous ${PREVIOUS:-none}"

          section() {
            awk -v start="## [$1]" -v stop="## [$3]" -v have_stop="${3:+yes}" '
              index($0, start) == 1 { found = 1; next }
              found && have_stop == "yes" && index($0, stop) == 1 { exit }
              found && have_stop != "yes" && /^## \[/ { exit }
              found { print }
            ' "$2"
          }

          notes() {
            local version="$1" file="$2" stop="" text
            # Collect intervening versions only when the file records the
            # previous release; the crates do not always move together
            if [ -n "$PREVIOUS" ] && grep -q "^## \[$PREVIOUS\]" "$file"; then
              stop="$PREVIOUS"
            fi
            text=$(section "$version" "$file" "$stop")
            if [ -z "$(echo "$text" | tr -d '[:space:]')" ]; then
              text=$(section "Unreleased" "$file" "$stop")
            fi
            # Trim surrounding blank lines
            echo "$text" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
          }

          # Assets are served under the tag once the draft is published, so the table can
          # link straight to them rather than name a file to go and find among the assets.
          DOWNLOAD="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          {
            echo "## Downloads"
            echo
            echo "Pick one file. If unsure which CPU you have, choose Intel or AMD."
            echo
            echo "| Platform | CPU | File | Checksum |"
            echo "| --- | --- | --- | --- |"
            # The same list the artifacts were checked against, so the table cannot promise
            # a file the release does not carry.
            while IFS='|' read -r platform cpu file; do
              echo "| ${platform} | ${cpu} | [\`${file}\`](${DOWNLOAD}/${file}) | [\`.sha256\`](${DOWNLOAD}/${file}.sha256) |"
            done < "${RUNNER_TEMP}/artifacts.txt"
            echo
            echo "The static Linux builds run on distributions with an older or different C library."
            echo
            echo "## Changes"
            echo
            notes "$VERSION" CHANGELOG.md
            LIB=$(notes "$LIB_VERSION" truehd/CHANGELOG.md)
            if [ -n "$(echo "$LIB" | tr -d '[:space:]')" ]; then
              echo
              echo "## Library (truehd crate)"
              echo
              echo "$LIB"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            Linux artifacts/*
            Windows artifacts/*
            macOS artifacts/*

      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_PKG_VERSION }}
          draft: true
          body_path: release-notes.md
          files: |
            Linux artifacts/*
            Windows artifacts/*
            macOS artifacts/*
