name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # An advisory can be published against a dependency that has not changed, so the
    # policy is checked on a timer as well as on a push.
    - cron: '0 6 * * 1'

jobs:
  ci:
    name: Check, test, rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust, clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check
        run: |
          cargo check --workspace --all-targets

      - name: Test
        run: |
          cargo test --workspace --all-targets

      - name: Rustfmt
        run: |
          cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --tests -- --deny warnings

  deny:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      # Full history so git describe can resolve the version string
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace
